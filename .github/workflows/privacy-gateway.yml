name: Local privacy gateway checks
on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'tools/privacy_gateway/**'
      - '.github/workflows/privacy-gateway.yml'
  push:
    branches: [dev]
    paths:
      - 'tools/privacy_gateway/**'
      - '.github/workflows/privacy-gateway.yml'
permissions:
  contents: read
jobs:
  privacy-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/privacy_gateway/tests -v
