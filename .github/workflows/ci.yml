name: Phase 1 checks
on:
  push:
    branches: ["dev", "feature/**", "fix/**"]
  pull_request:
    branches: ["dev", "main"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[test]"
      - run: ruff check role_ai tests qa
      - run: python -m pytest -q tests/test_agent_registry.py tests/test_baseline_manifest.py
      - run: python -m compileall -q role_ai
      - run: node --check role_ai/static/app.js
      - run: node qa/check_web_auth.cjs
      - run: node qa/check_chat_keyboard.cjs
      - run: python -m pip install --dry-run ".[training]"
      - run: python qa/run_excel_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requirements-unit-test-results
          path: |
            qa/Role-AI_unit_tests.xlsx
            qa/results/
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile collection config --quiet
      - run: docker compose -f compose.yaml -f compose.gpu.yaml --profile collection config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - run: |
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/api/health") as response:
              assert json.load(response) == {"status": "ok", "phase": 1}
          with urllib.request.urlopen("http://127.0.0.1:8000/") as response:
              assert "Role-AI" in response.read().decode()
          PY
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down --volumes
        if: always()

  code-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - name: Prepare explicit CI-only Python runtime
        run: |
          docker pull python:3.12-slim
          digest=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')
          echo "ROLE_AI_CODE_EXECUTION_IMAGE=python:3.12-slim@${digest#*@}" >> "$GITHUB_ENV"
      - run: python qa/check_code_execution.py
      - run: python qa/check_coding_runtime.py
      - name: Remove only this CI job's disposable test containers
        if: always()
        run: |
          ids=$(docker ps -aq --filter label=role-ai.code-execution=true)
          if [ -n "$ids" ]; then docker rm -fv $ids; fi
      - name: Remove only this CI job's coding runtime containers
        if: always()
        run: |
          ids=$(docker ps -aq --filter label=role-ai.coding-runtime=true)
          if [ -n "$ids" ]; then docker rm -fv $ids; fi

  rlaif-contract:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      WANDB_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU training runtime without pretrained weights
        run: |
          python -m pip install "torch>=2.5,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]" "transformers>=4.56,<5" "peft>=0.17,<0.19" "trl==0.28.0" "datasets>=4,<5"
      - name: Verify actual GRPO optimizer update with a random tiny local model
        run: python qa/check_rlaif_contract.py
