name: Phase 1 checks
on:
  push:
    branches: ["dev", "feature/**", "fix/**"]
  pull_request:
    branches: ["dev", "main"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[test]"
      - run: ruff check role_ai tests
      - run: python -m compileall -q role_ai
      - run: node --check role_ai/static/app.js
      - run: pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: test-results.xml
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - run: |
          python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8000/api/health") as response:
              assert json.load(response) == {"status": "ok", "phase": 1}
          with urllib.request.urlopen("http://127.0.0.1:8000/") as response:
              assert "Role-AI" in response.read().decode()
          PY
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down --volumes
        if: always()
