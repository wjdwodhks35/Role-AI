name: Codex log wrapper
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, "feature/codex-log-compression"]
permissions:
  contents: read
jobs:
  command-logs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools/codex/tests -v
      - run: python tools/codex/measure_logs.py
