[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "role-ai"
version = "0.1.0"
description = "Role-AI Phase 1 assistant platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<2.1",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
training = ["torch>=2.5,<3", "transformers>=4.56,<5", "peft>=0.17,<0.19", "trl>=0.28,<0.29", "datasets>=4,<5", "bitsandbytes>=0.45,<0.50"]
test = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["role_ai*"]

[tool.setuptools.package-data]
role_ai = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
