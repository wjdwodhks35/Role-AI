<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Role-AI 로컬 보안 검토</title>
<style>body{font:16px system-ui;background:#111827;color:#e5e7eb;max-width:960px;margin:32px auto;padding:0 20px}textarea{box-sizing:border-box;width:100%;min-height:150px;background:#1f2937;color:#fff;border:1px solid #6b7280;border-radius:8px;padding:12px}button{padding:10px 18px;margin:8px 8px 8px 0;cursor:pointer}button:disabled{cursor:not-allowed}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1f2937;padding:16px;border-radius:8px}.notice{color:#fbbf24}label{display:block;margin:12px 0}</style>
<h1>Role-AI 로컬 보안 검토</h1><p>원본은 이 PC에서 검사합니다. 외부에는 검토·승인한 내용만 전송합니다.</p>
<p class="notice">이름·기밀 내용은 자동 검사가 놓칠 수 있습니다. 원문 파일·폴더를 자동으로 읽지 않으며, 현재 Codex 통신도 가로채지 않습니다.</p>
<p id="status">연결 확인 중…</p><h2>보낼 내용</h2><textarea id="input" placeholder="질문이나 필요한 코드 조각만 입력하세요."></textarea><button id="inspect">로컬 검사·가림</button>
<h2>전송될 요청 전체 미리보기</h2><pre id="preview">로컬 작업 기록이 있으면 함께 표시됩니다.</pre><label><input id="approve" type="checkbox">위 내용 전체를 확인했으며 외부 전송을 허용합니다.</label><button id="send" disabled>검토한 요청 1회 전송</button><p id="message" role="status"></p><h2>답변</h2><pre id="answer"></pre>
<h2>로컬 작업 기록</h2><p>진행 상황·결정·다음 작업을 간결히 적어 저장하세요. 다음 요청의 문맥으로 포함되며 매번 미리보기에 표시됩니다. 원본 비밀값 대신 가려진 내용만 저장합니다.</p><textarea id="notes"></textarea><button id="save">검사 후 파일로 저장</button>
<script>
const token = new URLSearchParams(location.hash.slice(1)).get('token') || ''; history.replaceState(null,'',location.pathname);
const el=id=>document.getElementById(id); let draft=null, enabled=false;
async function api(path,body){const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body),cache:'no-store'});const result=await response.json();if(!response.ok)throw Error(result.error||'요청 실패');return result;}
function invalidate(){draft=null;el('approve').checked=false;el('send').disabled=true;}
function error(e){el('message').textContent=e.message;}
el('input').oninput=invalidate;el('notes').oninput=invalidate;
el('approve').onchange=()=>el('send').disabled=!(enabled&&draft&&!draft.blocked&&el('approve').checked);
el('inspect').onclick=async()=>{invalidate();try{draft=await api('/draft',{text:el('input').value});el('preview').textContent=JSON.stringify({destination:draft.destination,messages:draft.messages},null,2);el('message').textContent=draft.blocked?'비밀값 또는 불확실한 데이터가 감지되어 전송을 차단했습니다.':'검사 완료. 자동 검사만 믿지 말고 문맥까지 직접 확인하세요.';}catch(e){error(e);}};
el('send').onclick=async()=>{if(!draft||!el('approve').checked)return;const id=draft.draft_id;invalidate();try{const r=await api('/send',{draft_id:id,approved:true});el('answer').textContent=r.text;el('message').textContent='응답 완료. 기록에 남길 내용은 아래에 직접 저장하세요.';}catch(e){error(e);}};
el('save').onclick=async()=>{invalidate();try{const r=await api('/notes',{text:el('notes').value});el('notes').value=r.text;el('message').textContent='가려진 작업 기록을 로컬 WORK_NOTES.md에 저장했습니다.';}catch(e){error(e);}};
(async()=>{try{const r=await api('/status',{});enabled=r.forwarding;el('notes').value=r.notes;el('status').textContent=enabled?'외부 연결 설정이 켜져 있습니다. 승인한 요청만 전송됩니다.':'외부 연결 꺼짐 — 지금은 로컬 검사와 작업 기록 저장만 가능합니다.';}catch(e){el('status').textContent='접속 토큰이 없거나 유효하지 않습니다. 바탕 화면 실행 도우미로 다시 여세요.';}})();
</script></html>
